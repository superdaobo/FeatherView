name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（如 v0.1.0）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 正式发布：极致体积（fat LTO + codegen-units=1 + strip）
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 8
  CARGO_PROFILE_RELEASE_OPT_LEVEL: z
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_PANIC: abort
  CARGO_PROFILE_RELEASE_STRIP: symbols
  npm_config_audit: "false"
  npm_config_fund: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
          shared-key: featherview-release-windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer (NSIS)
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          Copy-Item $exe.FullName "dist-release/FeatherView_${{ github.ref_name }}_x64-setup.exe" -Force
          Copy-Item "src-tauri/target/release/featherview.exe" "dist-release/FeatherView_${{ github.ref_name }}_x64.exe" -Force
          Get-ChildItem dist-release | Select-Object Name, Length

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: FeatherView ${{ github.ref_name }}
          body: |
            ## FeatherView 轻阅 ${{ github.ref_name }}

            Windows 安装包（NSIS）与可执行文件。

            > 由 GitHub Actions 自动构建。
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
