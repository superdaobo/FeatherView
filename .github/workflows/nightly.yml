name: Nightly Build

on:
  schedule:
    - cron: "30 2 * * *"   # 每天 02:30 UTC（北京时间 10:30）
  workflow_dispatch:

concurrency:
  # 与 build.yml 的 build-${{ github.ref }} / release.yml 不冲突
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # 夜间构建：快速配置（thin LTO + 多 codegen units），与 build.yml 同风格
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 8
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_PANIC: abort
  CARGO_PROFILE_RELEASE_STRIP: symbols
  npm_config_audit: "false"
  npm_config_fund: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------- 通用质量门禁（ubuntu） ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy (all features)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ---------- Windows 桌面构建（exe + NSIS + 体积报告） ----------
  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
          shared-key: featherview-nightly-windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer (NSIS)
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --bundles nsis

      - name: Collect artifacts + size report
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-nightly | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          Copy-Item $exe.FullName "dist-nightly/FeatherView_${{ github.sha }}_nightly-x64-setup.exe" -Force
          Copy-Item "src-tauri/target/release/featherview.exe" "dist-nightly/FeatherView_${{ github.sha }}_nightly-x64.exe" -Force

          # artifact size report (job summary)
          "## Artifact Sizes" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist-nightly | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 2)
            "- {0} - {1} MB" -f $_.Name, $mb | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: featherview-nightly-windows
          path: dist-nightly/*
          if-no-files-found: error
          retention-days: 30

  # ---------- Android Debug APK（ubuntu + SDK/NDK） ----------
  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project (if absent)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init
          fi

      - name: Build Android debug APK (aarch64)
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist-nightly
          apk=$(find src-tauri/gen/android -name "*.apk" -path "*outputs*" | head -n 1)
          if [ -z "$apk" ]; then echo "APK not found"; exit 1; fi
          cp "$apk" "dist-nightly/FeatherView_${{ github.sha }}_nightly-arm64-debug.apk"
          ls -la dist-nightly

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: featherview-nightly-android
          path: dist-nightly/*
          if-no-files-found: error
          retention-days: 30

  # ---------- iOS 未签名产物（macos-26，Xcode 26） ----------
  build-ios:
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Initialize iOS project (if absent)
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init
          fi

      - name: Build unsigned app (xcodebuild archive)
        shell: bash
        run: |
          set -euo pipefail

          # ---- tauri CLI options server（参考成绩查询 tauri-app 的 ios-testflight.yml）----
          # tauri 2.11 生成的 xcodeproj 的 Build Rust Script 通过
          # $TMPDIR/<identifier>-server-addr 读取 CLI 构建配置；裸 xcodebuild 必须自行提供。
          export TMPDIR="$PWD/.tauri-ios-tmp"
          mkdir -p "$TMPDIR"
          IDENTIFIER="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).identifier")"
          PORT="$(python3 -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1]); s.close()")"
          echo "127.0.0.1:$PORT" > "$TMPDIR/${IDENTIFIER}-server-addr"
          LOG="$TMPDIR/options-server.log"
          TAURI_CLI_OPTIONS_PORT="$PORT" TMPDIR="$TMPDIR" \
            node scripts/ci/tauri-cli-options-server.cjs >"$LOG" 2>&1 &
          OPTIONS_PID=$!
          trap 'kill $OPTIONS_PID 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$OPTIONS_PID" 2>/dev/null || { echo "options server exited"; cat "$LOG"; exit 1; }
          echo "options server pid=$OPTIONS_PID port=$PORT"

          # ---- xcodebuild archive ----
          cd src-tauri/gen/apple
          APP_NAME=$(ls -d *.xcodeproj | head -n 1 | sed 's/\.xcodeproj$//')
          echo "APP_NAME=$APP_NAME"
          SCHEME=$(xcodebuild -list -project "$APP_NAME.xcodeproj" 2>/dev/null | grep -oE "[A-Za-z0-9_-]+_i[Oo][Ss]" | head -n 1 || true)
          echo "SCHEME=$SCHEME"
          if [ -z "$SCHEME" ]; then
            xcodebuild -list -project "$APP_NAME.xcodeproj"
            exit 1
          fi
          xcodebuild archive \
            -workspace "$APP_NAME.xcodeproj/project.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/FeatherView.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-nightly
          APP=$(find "$RUNNER_TEMP/ios-derived" -maxdepth 3 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            APP=$(find "$RUNNER_TEMP/FeatherView.xcarchive" -maxdepth 3 -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "no .app found"
            find "$RUNNER_TEMP" -maxdepth 4 -name "*.app" -type d 2>/dev/null | head -n 5
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" "Payload/览匣.app"
          zip -qry "Lanxia-unsigned.ipa" Payload
          mv "Lanxia-unsigned.ipa" "dist-nightly/FeatherView_${{ github.sha }}_nightly-unsigned.ipa"
          ls -la dist-nightly
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: featherview-nightly-ios
          path: dist-nightly/*
          if-no-files-found: error
          retention-days: 30
